# Keeps the demo activity simulator running in the cloud, so your laptop doesn't need to stay on.
# Each run lasts just under 6 hours (GitHub's limit) and a new one starts every 6 hours.
# Setup: Repo → Settings → Secrets and variables → Actions
#   - Secret   FIREBASE_SERVICE_ACCOUNT = the full contents of service-account.json
#   - Variable SIM_HOME_PROJECT         = your workspace id (optional)
#   - Variable SIM_UNTIL                = when to stop, e.g. 2026-11-26T23:59:00+05:30
# Start it right away from the Actions tab → "Simulate demo activity" → Run workflow.
name: Simulate demo activity

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: simulate-activity
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run simulator for this 6-hour window
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          ARGS="--live --for 350m"
          if [ -n "${{ vars.SIM_HOME_PROJECT }}" ]; then ARGS="$ARGS --home ${{ vars.SIM_HOME_PROJECT }}"; fi
          if [ -n "${{ vars.SIM_UNTIL }}" ]; then ARGS="$ARGS --until ${{ vars.SIM_UNTIL }}"; fi
          node scripts/simulate-activity.mjs $ARGS
